services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/chiraitori/image-api:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_ADDR=redis:6379
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=pixiv-images
      - S3_USE_SSL=false
      - RANDOM_POOL_TARGET_GB=5
      - PIXIV_COOKIE=${PIXIV_COOKIE:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - BLOCK_R18=${BLOCK_R18:-false}
    volumes:
      - tokens-data:/app/data
      - ./paperback-extensions/bundles:/app/paperback-extensions/bundles:ro
    depends_on:
      - redis
      - minio

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - minio-data:/data

volumes:
  redis-data:
  minio-data:
  tokens-data:
